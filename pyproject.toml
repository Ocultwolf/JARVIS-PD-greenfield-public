[project]
name = "jarvis-pd"
version = "0.1.0"
description = "JARVIS P.D. deterministic Phase 0 baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
jarvis = "jarvis_pd.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_pd"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
  "recovery: requires Docker and PostgreSQL tools",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/jarvis_pd/loop/application/integrity_service.py" = ["E501"]
"src/jarvis_pd/loop/application/tool_effect_service.py" = ["E501"]
"src/jarvis_pd/loop/application/reconciliation_service.py" = ["E501"]
"src/jarvis_pd/loop/application/compensation_service.py" = ["E501"]
"src/jarvis_pd/loop/application/worker_continuity.py" = ["E501"]
"tests/integration/test_wp4_worker_continuity.py" = ["E501"]

[tool.coverage.run]
source = ["jarvis_pd"]
branch = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
